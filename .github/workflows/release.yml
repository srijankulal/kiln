name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
env:
  XWIN_ACCEPT_LICENSE: '1'
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm nasm ninja-build zip
      - run: cargo install cargo-xwin --locked
      - run: cargo xwin build --release --locked --target x86_64-pc-windows-msvc
      - run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/*.exe dist/
          cp -r scripts dist/scripts || true
          cd dist && zip -r ../kiln-${GITHUB_REF_NAME}-windows-x64.zip . && cd ..
          sha256sum kiln-*.zip > SHA256SUMS.txt
      - run: gh release create ${GITHUB_REF_NAME} kiln-*.zip SHA256SUMS.txt --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
