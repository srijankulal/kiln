name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  XWIN_ACCEPT_LICENSE: '1'
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm nasm ninja-build libfontconfig1-dev libfreetype6-dev libudev-dev libasound2-dev pkg-config
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin,cargo-nextest,cargo-deny,cargo-audit
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked
      - run: cargo deny check || true
      - run: cargo audit || true
      - run: cargo xwin build --release --locked --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-windows-x64
          path: target/x86_64-pc-windows-msvc/release/*.exe

  windows:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'windows-ci')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
