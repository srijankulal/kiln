[package]
name = "kiln-core"
version = "0.1.0"
edition = "2021"
authors = ["Srijan <owner@kiln>"]
description = "Core types, traits, journal engine, state machine, and IPC contracts for Kiln"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
proptest = "1.5"
tempfile = "3.10"
